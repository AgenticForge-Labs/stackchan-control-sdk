name: Firmware overlay

on:
  pull_request:
    paths:
      - "firmware/**"
      - "tools/prepare_firmware.py"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned upstream firmware
        run: python3 tools/prepare_firmware.py --workspace "$GITHUB_WORKSPACE/.firmware-worktree"
      - name: Fetch upstream firmware dependencies
        working-directory: .firmware-worktree/StackChan/firmware
        run: python3 ./fetch_repos.py
      - name: Build firmware
        working-directory: .firmware-worktree/StackChan/firmware
        run: idf.py build
